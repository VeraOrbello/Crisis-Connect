# FILE: src/main/resources/config/application.properties
# =====================================================
# CrisisConnect Application Configuration
# =====================================================

# Application Information
app.name=CrisisConnect
app.version=1.0.0
app.description=Emergency response and crisis management platform

# Server Configuration
server.port=8080
server.servlet.context-path=/
server.servlet.session.timeout=30m

# Database Configuration
spring.datasource.url=jdbc:sqlite:crisis_connect.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# External API Configuration
weather.api.key=your_actual_api_key_here
weather.api.base-url=https://api.weatherapi.com/v1
weather.api.timeout=5000

# Emergency Services API
emergency.api.base-url=https://api.emergency-services.com/v1
emergency.api.timeout=3000
emergency.api.retry-attempts=3

# Logging Configuration
logging.level.com.crisisconnect=INFO
logging.level.org.springframework=WARN
logging.level.org.hibernate=WARN
logging.file.name=logs/crisis-connect.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Security Configuration (Update these in production!)
security.jwt.secret=your-jwt-secret-key-change-in-production
security.jwt.expiration=86400000 # 24 hours in milliseconds

# Email Configuration (for alerts)
email.host=smtp.gmail.com
email.port=587
email.username=your-email@gmail.com
email.password=your-app-password
email.from=noreply@crisisconnect.org

# SMS Gateway Configuration
sms.api.key=your-sms-api-key
sms.api.url=https://api.sms-gateway.com/v1/send
sms.sender.id=CRISISCONNECT

# Cache Configuration
spring.cache.type=simple
spring.cache.cache-names=emergencyContacts,resourceLocations,weatherData

# File Upload Configuration
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Feature Toggles
feature.weather-alerts.enabled=true
feature.sms-notifications.enabled=true
feature.email-alerts.enabled=true
feature.realtime-updates.enabled=true

# Monitoring and Health
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized